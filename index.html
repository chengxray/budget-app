<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#312e81" media="(prefers-color-scheme: dark)">
  <meta name="description" content="個人收支管理 PWA - 記帳、預算、圖表分析">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="記帳">
  <title>個人記帳本</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon / App Icon Fallback (SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            gray: {
              750: '#374151'
            }
          }
        }
      }
    };
  </script>

  <!-- Dexie.js - IndexedDB wrapper -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>

  <!-- Chart.js 4 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* Base styles */
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      font-family: 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      -webkit-font-smoothing: antialiased;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
    }

    /* Safe area support */
    #app-shell {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #bottom-nav {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Scrollbar hide */
    #page-content::-webkit-scrollbar { display: none; }
    #page-content { -ms-overflow-style: none; scrollbar-width: none; }

    /* Smooth page transitions */
    #page-content { transition: opacity 0.15s ease; }
    #page-content.fading { opacity: 0; }

    /* FAB shadow */
    #fab-btn {
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.45);
    }
    #fab-btn:active { transform: scale(0.94); }

    /* Animations */
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .slide-up { animation: slideUp 0.3s ease forwards; }

    /* Bottom nav */
    #bottom-nav {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(0,0,0,0.06);
    }
    @media (prefers-color-scheme: dark) {
      #bottom-nav {
        background: rgba(17,24,39,0.95);
        border-top-color: rgba(255,255,255,0.08);
      }
    }

    /* Inputs */
    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0.5;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    }

    /* Loading splash */
    #splash {
      position: fixed; inset: 0; z-index: 100;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: white; transition: opacity 0.4s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900">

  <!-- Loading Splash -->
  <div id="splash">
    <div style="font-size:64px;margin-bottom:16px;">💰</div>
    <h1 style="font-size:24px;font-weight:bold;margin:0 0 8px;">個人記帳本</h1>
    <p style="font-size:14px;opacity:0.8;margin:0 0 32px;">智慧管理您的收支</p>
    <div style="width:40px;height:40px;border:4px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>

  <!-- App Shell -->
  <div id="app-shell" class="flex flex-col h-screen max-w-lg mx-auto relative">

    <!-- Page Content -->
    <main id="page-content" class="flex-1 overflow-y-auto">
      <!-- Content rendered by JS -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav id="bottom-nav" class="flex fixed bottom-0 left-0 right-0 z-30 max-w-lg mx-auto">
      <!-- Rendered by Components.renderBottomNav() -->
    </nav>

  </div>

  <!-- Floating Action Button (FAB) -->
  <button id="fab-btn"
    class="fixed bottom-20 right-4 z-30 w-14 h-14 bg-indigo-500 hover:bg-indigo-600 text-white rounded-full flex items-center justify-center text-3xl font-light shadow-xl transition-transform active:scale-90"
    style="right: calc(max(16px, env(safe-area-inset-right)));"
    aria-label="新增記帳">
    +
  </button>

  <!-- JS Files (order matters: db → utils → components → pages → app) -->
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/transactions.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/budget.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/report.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Hide splash after app loads
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(() => splash.remove(), 400);
        }
      }, 800);
    });
  </script>
</body>
</html>
